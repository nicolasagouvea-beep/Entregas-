<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota de Entregas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#eceef0;--card:#fff;--ink:#101820;--mut:#5b6773;--line:#d5d9de;--amber:#ffb400;--on-amber:#101820;--ok:#1f9d55;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0e1319;--card:#18212b;--ink:#f1f3f5;--mut:#98a4b0;--line:#2a3643;--err:#ff6b6b}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
#map{flex:0 0 42vh;background:#cfd6dc}
main{flex:1;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
h2{font:700 22px 'Barlow Condensed',sans-serif;margin:0 0 8px}
h2 small{font:500 15px Barlow,sans-serif;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
summary{font-weight:600;cursor:pointer;min-height:32px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button,.btn{min-height:48px;border:0;border-radius:8px;font:600 16px Barlow,sans-serif;padding:0 16px;cursor:pointer;display:grid;place-items:center;text-decoration:none;width:100%}
button:disabled{opacity:.5}
.pri{background:var(--amber);color:var(--on-amber)}
.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.mini{min-height:40px;width:auto;padding:0 10px;background:transparent;border:1.5px solid var(--line);color:var(--ink);font-size:14px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.gap{margin-top:8px}
#msg{min-height:20px;color:var(--mut);font-size:14px;margin-top:8px}
#msg.err{color:var(--err)}
ol{list-style:none;margin:0;padding:0}
.stop{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.n{flex:0 0 38px;height:38px;border-radius:50%;background:var(--amber);color:var(--on-amber);font:700 22px 'Barlow Condensed',sans-serif;display:grid;place-items:center}
.done .n{background:var(--ok);color:#fff}
.done .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1;min-width:0}.t b{display:block}.t span{font-size:14px;color:var(--mut)}
.acts{display:flex;flex-direction:column;gap:4px}
#vazio{color:var(--mut);margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px}
.kpi b{display:block;font:700 28px/1.1 'Barlow Condensed',sans-serif}
.kpi span{font-size:13px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;font-size:12px;color:var(--mut)}
.bar i{display:block;width:100%;background:var(--amber);border-radius:4px 4px 0 0;min-height:2px}
</style>
</head>
<body>
<div id="map" aria-label="Mapa"></div>
<main>
  <details class="card" id="cfg">
    <summary>Chave do Google Maps</summary>
    <p style="font-size:14px;color:var(--mut)">Ative no Google Cloud: Maps JavaScript API, Geocoding API e Directions API. Cole a chave abaixo.</p>
    <input id="key" placeholder="Chave de API" autocomplete="off">
    <button class="pri gap" id="saveKey">Salvar e carregar mapa</button>
  </details>

  <section class="card">
    <h2>Ler cupom</h2>
    <input id="foto" type="file" accept="image/*" capture="environment">
    <button class="pri gap" id="ler">Ler endereço do cupom</button>
    <label for="nome">Cliente (opcional)</label>
    <input id="nome">
    <label for="valor">Valor da entrega em R$ (opcional)</label>
    <input id="valor" inputmode="decimal" placeholder="0,00">
    <label for="end">Endereço</label>
    <textarea id="end" rows="2" placeholder="Rua, número, bairro, cidade"></textarea>
    <button class="sec gap" id="add">Adicionar entrega</button>
    <div id="msg" role="status"></div>
  </section>

  <section class="card">
    <h2>Entregas <small id="cnt"></small></h2>
    <ol id="lista"></ol>
    <p id="vazio">Nenhuma entrega ainda. Fotografe um cupom para começar.</p>
    <div class="row">
      <button class="pri" id="rota">Traçar melhor rota</button>
      <a class="btn sec" id="gmaps" target="_blank" rel="noopener">Abrir no Google Maps</a>
    </div>
  </section>

  <section class="card">
    <h2>Análises <small id="tot"></small></h2>
    <div class="kpis" id="kpis"></div>
    <div class="bars" id="bars" aria-label="Entregas nos últimos 7 dias"></div>
    <button class="pri gap" id="exportar">Exportar planilha (CSV)</button>
    <button class="sec gap" id="limpar">Limpar histórico</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let hist = store.get('hist', []), stops = store.get('stops', []), map, geo, dirs, rend, me, marks = [], pos = null;

function msg(t, err){ const m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; }
function save(){ store.set('stops', stops); store.set('hist', hist); }

/* ---------- Google Maps ---------- */
function loadMaps(k){
  if(!k){ $('cfg').open = true; return; }
  window.initMap = initMap;
  window.gm_authFailure = () => msg('Chave do Google Maps recusada. Confira a chave e as APIs ativadas.', true);
  const s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(k) + '&callback=initMap';
  s.onerror = () => msg('Não foi possível carregar o Google Maps.', true);
  document.head.appendChild(s);
}

function initMap(){
  map = new google.maps.Map($('map'), {
    center: {lat: -23.55, lng: -46.63}, zoom: 12,
    disableDefaultUI: true, zoomControl: true, clickableIcons: false
  });
  geo = new google.maps.Geocoder();
  dirs = new google.maps.DirectionsService();
  rend = new google.maps.DirectionsRenderer({
    map, suppressMarkers: true,
    polylineOptions: {strokeColor: '#ffb400', strokeWeight: 6}
  });
  if(navigator.geolocation){
    navigator.geolocation.watchPosition(p => {
      pos = {lat: p.coords.latitude, lng: p.coords.longitude};
      if(!me){
        me = new google.maps.Marker({map, position: pos, icon: {
          path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#1a73e8',
          fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3}});
        map.setCenter(pos);
      } else me.setPosition(pos);
      link();
    }, () => {}, {enableHighAccuracy: true});
  }
  render();
}

/* ---------- Leitura do cupom (OCR) ---------- */
function extrair(t){
  const L = t.split('\n').map(x => x.trim()).filter(Boolean);
  const via = /\b(rua|r\.|av\.?|avenida|travessa|tv\.|alameda|al\.|estrada|rodovia|pra[cç]a|largo)\s/i;
  const extra = /\d{5}-?\d{3}|bairro|\b[A-Za-zÀ-ú ]+\s*[-\/]\s*[A-Z]{2}\b/i;
  const i = L.findIndex(l => via.test(l));
  let end = i >= 0 ? L[i] : '';
  if(i >= 0){
    for(let j = i + 1; j <= i + 2 && j < L.length; j++){
      if(extra.test(L[j]) && L[j].length < 70) end += ', ' + L[j];
    }
  }
  const cep = t.match(/\d{5}-?\d{3}/);
  if(cep && !end.includes(cep[0])) end += (end ? ', ' : '') + cep[0];
  const c = t.match(/(?:cliente|nome)\s*[:\-]?\s*(.+)/i);
  return {end: end.replace(/\s+/g, ' '), nome: c ? c[1].trim() : ''};
}

$('ler').onclick = async () => {
  const f = $('foto').files[0];
  if(!f) return msg('Escolha ou tire uma foto do cupom.', true);
  if(!window.Tesseract) return msg('O leitor de texto não carregou. Verifique a internet.', true);
  $('ler').disabled = true; msg('Lendo cupom…');
  try{
    const r = await Tesseract.recognize(f, 'por', {logger: m => {
      if(m.status === 'recognizing text') msg('Lendo cupom… ' + Math.round(m.progress * 100) + '%');
    }});
    const x = extrair(r.data.text);
    $('end').value = x.end || r.data.text.trim();
    if(x.nome) $('nome').value = x.nome;
    msg(x.end ? 'Endereço encontrado. Confira antes de adicionar.' : 'Não achei um endereço claro. Edite o texto abaixo.', !x.end);
  } catch(e){
    msg('Falha ao ler a imagem. Tente uma foto mais nítida.', true);
  }
  $('ler').disabled = false;
};

/* ---------- Entregas ---------- */
$('add').onclick = () => {
  const a = $('end').value.trim();
  if(!a) return msg('Digite ou leia um endereço.', true);
  if(!geo) return msg('Carregue o mapa primeiro com a chave do Google Maps.', true);
  msg('Localizando endereço…');
  geo.geocode({address: a, region: 'br'}, (res, st) => {
    if(st !== 'OK') return msg('Endereço não encontrado (' + st + '). Inclua bairro e cidade.', true);
    const l = res[0].geometry.location;
    stops.push({id: Date.now(), nome: $('nome').value.trim(), end: res[0].formatted_address, lat: l.lat(), lng: l.lng(), feito: false, valor: parseFloat(($('valor').value || '').replace(',', '.')) || 0});
    save(); render();
    $('end').value = ''; $('nome').value = ''; $('valor').value = ''; $('foto').value = '';
    msg('Entrega adicionada.');
  });
};

function toggle(s){
  s.feito = !s.feito;
  if(s.feito) hist.push({id: s.id, nome: s.nome, end: s.end, lat: s.lat, lng: s.lng, valor: s.valor || 0, ts: Date.now()});
  else hist = hist.filter(h => h.id !== s.id);
  save(); render();
}

function btn(txt, fn){
  const b = document.createElement('button');
  b.className = 'mini'; b.textContent = txt; b.onclick = fn;
  return b;
}

function render(){
  const ol = $('lista'); ol.innerHTML = '';
  const pend = stops.filter(s => !s.feito).length;
  $('cnt').textContent = stops.length ? pend + ' pendentes' : '';
  $('vazio').hidden = stops.length > 0;
  stops.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'stop' + (s.feito ? ' done' : '');
    li.innerHTML = '<div class="n"></div><div class="t"><b></b><span></span></div><div class="acts"></div>';
    li.querySelector('.n').textContent = i + 1;
    li.querySelector('b').textContent = s.nome || 'Entrega ' + (i + 1);
    li.querySelector('span').textContent = s.end;
    const acts = li.querySelector('.acts');
    acts.appendChild(btn(s.feito ? 'Reabrir' : 'Entregue', () => toggle(s)));
    acts.appendChild(btn('Remover', () => { stops = stops.filter(x => x.id !== s.id); save(); render(); }));
    ol.appendChild(li);
  });
  if(map){
    marks.forEach(m => m.setMap(null)); marks = [];
    const bd = new google.maps.LatLngBounds();
    stops.forEach((s, i) => {
      marks.push(new google.maps.Marker({map, position: {lat: s.lat, lng: s.lng},
        label: {text: String(i + 1), fontWeight: '700'}, opacity: s.feito ? .5 : 1}));
      bd.extend({lat: s.lat, lng: s.lng});
    });
    if(stops.length) map.fitBounds(bd, 60);
  }
  link();
  analises();
}

/* ---------- Análises ---------- */
const brl = v => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
function km(a, b){
  const r = x => x * Math.PI / 180, R = 6371;
  const dl = r(b.lat - a.lat), dg = r(b.lng - a.lng);
  const q = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dg / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(q));
}
function analises(){
  const DAY = 864e5;
  const dia = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const hoje = dia(Date.now());
  const h = hist.slice().sort((a, b) => a.ts - b.ts);
  const dHoje = h.filter(x => dia(x.ts) === hoje);
  const sem = h.filter(x => dia(x.ts) > hoje - 7 * DAY);
  const soma = a => a.reduce((t, x) => t + (x.valor || 0), 0);
  const ints = []; let dist = 0;
  for(let i = 1; i < h.length; i++){
    if(dia(h[i].ts) !== dia(h[i - 1].ts)) continue;
    const dt = h[i].ts - h[i - 1].ts;
    if(dt < 3 * 3600e3) ints.push(dt);
    if(dia(h[i].ts) === hoje) dist += km(h[i - 1], h[i]);
  }
  const med = ints.length ? Math.round(ints.reduce((a, b) => a + b, 0) / ints.length / 60000) + ' min' : '–';
  $('tot').textContent = h.length ? h.length + ' no total' : '';
  const k = [
    ['Entregas hoje', dHoje.length],
    ['Últimos 7 dias', sem.length],
    ['Ganho hoje', brl(soma(dHoje))],
    ['Ganho em 7 dias', brl(soma(sem))],
    ['Tempo médio entre entregas', med],
    ['Distância hoje (linha reta)', dist.toFixed(1).replace('.', ',') + ' km']
  ];
  const box = $('kpis'); box.innerHTML = '';
  k.forEach(([l, v]) => {
    const d = document.createElement('div'); d.className = 'kpi';
    d.innerHTML = '<b></b><span></span>';
    d.querySelector('b').textContent = v; d.querySelector('span').textContent = l;
    box.appendChild(d);
  });
  const dias = [];
  for(let i = 6; i >= 0; i--){
    const t = hoje - i * DAY;
    dias.push({t, n: h.filter(x => dia(x.ts) === t).length});
  }
  const max = Math.max(1, ...dias.map(d => d.n));
  const bars = $('bars'); bars.innerHTML = '';
  dias.forEach(d => {
    const el = document.createElement('div'); el.className = 'bar';
    el.innerHTML = '<em></em><i></i><span></span>';
    el.querySelector('em').textContent = d.n;
    el.querySelector('i').style.height = Math.round(d.n / max * 56) + 'px';
    el.querySelector('span').textContent = new Date(d.t).toLocaleDateString('pt-BR', {weekday: 'short'}).replace('.', '');
    bars.appendChild(el);
  });
}
$('exportar').onclick = () => {
  if(!hist.length) return msg('Ainda não há entregas concluídas para exportar.', true);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const linhas = [['Data', 'Hora', 'Cliente', 'Endereço', 'Valor (R$)'].map(q).join(';')];
  hist.slice().sort((a, b) => a.ts - b.ts).forEach(x => {
    const d = new Date(x.ts);
    linhas.push([
      d.toLocaleDateString('pt-BR'),
      d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}),
      x.nome || '', x.end || '',
      (x.valor || 0).toFixed(2).replace('.', ',')
    ].map(q).join(';'));
  });
  const blob = new Blob(['\ufeff' + linhas.join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'entregas-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  msg('Planilha exportada.');
};
$('limpar').onclick = () => {
  if(confirm('Apagar todo o histórico de entregas concluídas?')){ hist = []; save(); analises(); }
};

/* ---------- Rota ---------- */
function dist(a, b){ return (a.lat - b.lat) ** 2 + (a.lng - b.lng) ** 2; }

$('rota').onclick = () => {
  const pend = stops.filter(s => !s.feito);
  if(!dirs) return msg('Carregue o mapa primeiro com a chave do Google Maps.', true);
  if(!pend.length) return msg('Não há entregas pendentes.', true);
  if(pend.length > 24) return msg('Máximo de 24 entregas pendentes por rota.', true);
  const origin = pos || {lat: pend[0].lat, lng: pend[0].lng};
  let far = 0;
  pend.forEach((s, i) => { if(dist(origin, s) > dist(origin, pend[far])) far = i; });
  const dest = pend[far], mid = pend.filter((_, i) => i !== far);
  msg('Calculando rota…');
  dirs.route({
    origin, destination: {lat: dest.lat, lng: dest.lng},
    waypoints: mid.map(s => ({location: {lat: s.lat, lng: s.lng}, stopover: true})),
    optimizeWaypoints: true, travelMode: 'DRIVING'
  }, (r, st) => {
    if(st !== 'OK') return msg('Não consegui traçar a rota (' + st + ').', true);
    rend.setDirections(r);
    const ordem = r.routes[0].waypoint_order.map(i => mid[i]).concat(dest);
    stops = ordem.concat(stops.filter(s => s.feito));
    save(); render();
    rend.setDirections(r);
    msg('Rota pronta. Siga a ordem numerada.');
  });
};

function link(){
  const pend = stops.filter(s => !s.feito);
  const a = $('gmaps');
  if(!pend.length){ a.removeAttribute('href'); return; }
  const c = s => s.lat + ',' + s.lng;
  const d = pend[pend.length - 1], w = pend.slice(0, -1).map(c).join('|');
  let u = 'https://www.google.com/maps/dir/?api=1&travelmode=two-wheeler&destination=' + c(d);
  if(w) u += '&waypoints=' + encodeURIComponent(w);
  if(pos) u += '&origin=' + c(pos);
  a.href = u;
}

/* ---------- Início ---------- */
$('saveKey').onclick = () => {
  const k = $('key').value.trim();
  if(!k) return msg('Cole a chave de API.', true);
  store.set('key', k); location.reload();
};
const k0 = store.get('key', '');
$('key').value = k0;
render();
loadMaps(k0);
</script>
</body>
</html>
